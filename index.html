<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>MSC Shift Simulation</title>

<style>
/* Layout: an Iris-like work surface (top nav + one working card) with a two-pane conversation dialog. */
:root{
  --bg:#ffffff; --fg:#18181b; --muted:#f4f4f5; --muted-fg:#71717a; --border:#e4e4e7; --card:#ffffff;
  --primary:#27272a; --primary-fg:#fafafa; --ring:#a1a1aa;
  --red-bg:#fef2f2; --red-bd:#fecaca; --red-chip:#fee2e2; --red-fg:#b91c1c;
  --amber-bg:#fffbeb; --amber-bd:#fde68a; --amber-chip:#fef3c7; --amber-fg:#92400e;
  --sky-chip:#e0f2fe; --sky-fg:#075985; --green-chip:#dcfce7; --green-fg:#166534;
  --bubble-me:#27272a; --bubble-me-fg:#fafafa; --bubble-them:#f4f4f5; --shadow:0 10px 40px rgba(0,0,0,.18);
  --font:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --fg:#fafafa; --muted:#18181b; --muted-fg:#a1a1aa; --border:#27272a; --card:#121214;
  --primary:#e4e4e7; --primary-fg:#18181b; --ring:#52525b;
  --red-bg:#2a1215; --red-bd:#7f1d1d; --red-chip:#450a0a; --red-fg:#fca5a5;
  --amber-bg:#261d0b; --amber-bd:#78350f; --amber-chip:#451a03; --amber-fg:#fcd34d;
  --sky-chip:#082f49; --sky-fg:#7dd3fc; --green-chip:#052e16; --green-fg:#86efac;
  --bubble-me:#e4e4e7; --bubble-me-fg:#18181b; --bubble-them:#27272a; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa; --muted:#18181b; --muted-fg:#a1a1aa; --border:#27272a; --card:#121214;
  --primary:#e4e4e7; --primary-fg:#18181b; --ring:#52525b;
  --red-bg:#2a1215; --red-bd:#7f1d1d; --red-chip:#450a0a; --red-fg:#fca5a5;
  --amber-bg:#261d0b; --amber-bd:#78350f; --amber-chip:#451a03; --amber-fg:#fcd34d;
  --sky-chip:#082f49; --sky-fg:#7dd3fc; --green-chip:#052e16; --green-fg:#86efac;
  --bubble-me:#e4e4e7; --bubble-me-fg:#18181b; --bubble-them:#27272a; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
a{color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--muted)}
.btn.danger{color:var(--red-fg);border-color:var(--red-bd)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-fg);white-space:nowrap}
.chip.red{background:var(--red-chip);color:var(--red-fg)}.chip.amber{background:var(--amber-chip);color:var(--amber-fg)}.chip.sky{background:var(--sky-chip);color:var(--sky-fg)}.chip.green{background:var(--green-chip);color:var(--green-fg)}
.muted{color:var(--muted-fg)}
.small{font-size:12px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0}
textarea{resize:vertical;width:100%}
label{font-size:12px;font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.top-in{display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo-tile{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:700}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted-fg);display:flex;gap:6px;align-items:center}
.nav button.on{background:var(--muted);color:var(--fg)}
.nav .count{font-size:11px;background:var(--primary);color:var(--primary-fg);border-radius:999px;padding:0 6px;line-height:17px}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--muted)}
.timer.warn{background:var(--amber-chip);color:var(--amber-fg)}
.prog{font-size:12px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.banner{padding:8px 0;font-size:12.5px;background:var(--amber-bg);border-bottom:1px solid var(--amber-bd);color:var(--amber-fg)}

main{padding-block:20px 120px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.card-h{padding:14px 16px 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.card-b{padding:0 16px 16px}
.sec-h{font-size:12px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card)}
.row.amber{background:var(--amber-bg);border-color:var(--amber-bd)}
.row.done{opacity:.7}
.av{flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-prev{font-size:12px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.when{font-size:11.5px;color:var(--muted-fg);white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted-fg)}
.max{max-width:1100px;margin:0 auto}

/* dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(1220px,100%);height:min(820px,100%);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane+.pane{border-left:1px solid var(--border);background:var(--muted)}
.pane-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pane-h .ttl{font-weight:600}
.thread{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--bubble-them);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-fg)}
.msg .meta{display:block;font-size:10.5px;opacity:.7;margin-bottom:2px;font-weight:600}
.sys{align-self:center;font-size:11.5px;color:var(--muted-fg);background:var(--muted);border-radius:999px;padding:3px 10px;text-align:center}
.video{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:6px;padding:8px;border-radius:8px;background:rgba(0,0,0,.08)}
.composer{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.asbar{font-size:12px;background:var(--muted);border-radius:8px;padding:6px 10px}
.pill{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;background:var(--card)}
.pill button{border:0;background:transparent;padding:0 6px}
.slash{position:absolute;bottom:100%;left:12px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:6px;z-index:5}
.slash button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:7px;font-size:13px}
.slash button:hover{background:var(--muted)}
.comp-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hand{border-top:1px dashed var(--border);padding:10px 14px;background:var(--muted);display:grid;gap:8px}
.tabs{display:flex;gap:2px;padding:8px 10px 0;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:transparent;padding:7px 10px;font-size:12.5px;font-weight:500;color:var(--muted-fg);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tab-b{flex:1;overflow:auto;padding:14px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted-fg)}
.kv dd{margin:0}
.wk{margin-bottom:14px}
.wk-h{font-size:11.5px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.wo{border:1px solid var(--border);background:var(--card);border-radius:8px;margin-bottom:6px}
.wo-h{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;flex-wrap:wrap}
.wo-h .d{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted-fg);width:78px}
.wo-b{padding:4px 10px 10px;display:grid;gap:6px}
.ex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ex .rx{color:var(--muted-fg);font-size:12px}
.inline-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;border-radius:8px;background:var(--muted)}

/* calendar */
.cal-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.cal{border-collapse:collapse;min-width:820px;width:100%;font-size:12px}
.cal th{position:sticky;top:0;background:var(--card);padding:8px 6px;border-bottom:1px solid var(--border);font-weight:600;text-align:left}
.cal td{border-top:1px solid var(--border);padding:2px 4px;height:28px;vertical-align:middle}
.cal td.t{color:var(--muted-fg);width:62px;font-variant-numeric:tabular-nums}
.slot{width:100%;height:24px;border-radius:6px;border:1px dashed var(--border);background:transparent;font-size:11px;color:var(--muted-fg);text-align:left;padding:0 6px}
.slot:hover{border-style:solid;border-color:var(--fg);color:var(--fg)}
.slot.bk{border:0;background:var(--muted);color:var(--fg);font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.ours{background:var(--sky-chip);color:var(--sky-fg)}
.slot.yours{background:var(--green-chip);color:var(--green-fg)}
.slot.cx{text-decoration:line-through;opacity:.6}
.closed{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--muted) 6px 12px)}
.side{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:90px;width:min(380px,calc(100vw - 32px));z-index:40;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}

/* billing */
.bill{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.cust{display:flex;flex-direction:column;gap:2px;max-height:620px;overflow:auto}
.cust button{border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:7px;font-size:13px}
.cust button.on,.cust button:hover{background:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted-fg);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* playbook */
.pb{max-width:860px}
.pb section{padding:18px 0;border-bottom:1px solid var(--border)}
.pb h3{font-size:16px;margin-bottom:8px}
.pb p,.pb li{max-width:68ch}
.pb ul{padding-left:20px;margin:6px 0}
.pb li{margin:3px 0}
.pb-table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
.pb-table th,.pb-table td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
.pb-table th{background:var(--muted)}
.pb-note{font-size:12.5px;color:var(--muted-fg)}
.pb-wrap{overflow-x:auto}

/* reasoning note + edit */
.why{border-top:1px dashed var(--border);padding-top:8px;display:grid;gap:4px}
.why textarea{min-height:44px}
.why-saved{background:var(--muted);border-radius:8px;padding:6px 9px;white-space:pre-wrap;font-size:13px}
.msg .edit-l{display:block;margin-top:4px;font-size:11px;opacity:.8}
.msg .edit-l button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.msg-edit{display:grid;gap:6px;align-self:stretch}

/* intro screens */
.intro{max-width:720px;margin:0 auto;padding-block:40px 80px;display:grid;gap:18px}
.intro h1{font-size:28px;letter-spacing:-.01em}
.intro .lead{font-size:15px;color:var(--muted-fg);max-width:62ch}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step b.n{width:26px;height:26px;border-radius:999px;background:var(--muted);display:grid;place-items:center;font-size:12px}
.rules li{margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--primary-fg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;box-shadow:var(--shadow)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted-fg)}
.scroll-x{overflow-x:auto}
pre.log{font-family:var(--mono);font-size:11px;white-space:pre-wrap;max-height:420px;overflow:auto;background:var(--muted);padding:10px;border-radius:8px}

@media (max-width:860px){
  .dlg{grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);height:100%}
  .pane+.pane{border-left:0;border-top:1px solid var(--border)}
  .pane{overflow:auto} .pane .thread{flex:1 0 auto;min-height:120px;overflow:visible}
  .bill{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
// Fictional world for the MSC assessment. Every person, price, address and policy here is made up for the exercise.
const SIM = { today: "2026-12-05", now: "9:00 AM", label: "Saturday, Dec 5 · 9:00 AM PT" };

const OFFICES = {
  SF: { name: "San Francisco", hours: "Mon–Sat 7:00 AM–7:00 PM (Sat until 2:00 PM). Closed Sun.", days: [1,2,3,4,5,6], parking: "Validated parking in the Harbor Lane garage across the street, level 2. Bring your ticket to the front desk." , gm: "erin"},
  PA: { name: "Palo Alto", hours: "Tue–Sun 7:00 AM–6:00 PM. Closed Mon.", days: [0,2,3,4,5,6], parking: "Free lot behind the building; use any spot marked Kalos.", gm: "marcus" },
  SJ: { name: "San Jose", hours: "Mon–Fri 7:00 AM–7:00 PM, Sat 7:00 AM–12:00 PM. Closed Sun.", days: [1,2,3,4,5,6], parking: "Street parking on Alder St (2-hour limit).", gm: "marcus" },
  WC: { name: "Walnut Creek", hours: "Tue–Sat 7:00 AM–5:00 PM. Closed Sun–Mon.", days: [2,3,4,5,6], parking: "Free parking in the Oak Plaza lot.", gm: "erin" },
};

const STAFF = {
  nadia: { name: "Nadia Ortiz", role: "Coach · SF + Walnut Creek", status: "Off today and tomorrow · back Mon Dec 7" },
  owen: { name: "Owen Lee", role: "Coach · Palo Alto + San Jose", status: "On PTO · back Wed Dec 9" },
  sam: { name: "Sam Rivera", role: "Coach · San Francisco", status: "Working today 8 AM–2 PM (SF)" },
  erin: { name: "Erin Walsh", role: "GM · San Francisco + Walnut Creek", status: "Working today" },
  marcus: { name: "Marcus Bell", role: "GM · Palo Alto + San Jose", status: "Working today" },
};

const PRICES = [
  ["First DEXA scan", "$150"],
  ["Extra progress scan", "$95"],
  ["4-week program", "$499"],
  ["12-week package", "$1,788"],
  ["Monthly membership", "$399 / month"],
  ["Coaching add-on (nutrition)", "$49 / month"],
];

// Exercise catalog. pattern = what a fair swap keeps.
const CATALOG = [
  ["Barbell Back Squat","Squat"],["DB Goblet Squat","Squat"],["Leg Press","Squat"],
  ["Bulgarian Split Squat","Single-leg"],["Reverse Lunge","Single-leg"],["DB Step-Up","Single-leg"],["Walking Lunge","Single-leg"],
  ["Leg Extension","Knee isolation"],["Hamstring Curl","Knee isolation"],
  ["Barbell RDL","Hinge"],["DB RDL","Hinge"],["Hip Thrust","Hinge"],["Back Extension","Hinge"],["Glute Bridge","Hinge"],
  ["Lat Pulldown","Vertical pull"],["Assisted Pull-Up","Vertical pull"],["Band Pulldown","Vertical pull"],
  ["1-Arm DB Row","Horizontal pull"],["Chest-Supported Row","Horizontal pull"],["Seated Cable Row","Horizontal pull"],
  ["DB Bench Press","Horizontal push"],["Barbell Bench Press","Horizontal push"],["Push-Up","Horizontal push"],
  ["DB Shoulder Press","Vertical push"],["Pike Push-Up","Vertical push"],
  ["Plank","Core"],["Dead Bug","Core"],["Hanging Knee Raise","Core"],
  ["Bike Sprints","Conditioning"],["Rower Intervals","Conditioning"],["Incline Walk","Conditioning"],
];
const PATTERN = Object.fromEntries(CATALOG);

const TEMPLATES = {
  "Upper A": [["DB Bench Press","3×8–10 @ RPE 8"],["1-Arm DB Row","3×10"],["DB Shoulder Press","3×10"],["Lat Pulldown","3×10–12"],["Plank","3×40s"]],
  "Upper B": [["Barbell Bench Press","4×6"],["Chest-Supported Row","3×10"],["Assisted Pull-Up","3×8"],["Push-Up","2×AMRAP"],["Dead Bug","3×10"]],
  "Lower A": [["Barbell Back Squat","4×6 @ RPE 7–8"],["Barbell RDL","3×8"],["Bulgarian Split Squat","3×8/leg"],["Hamstring Curl","3×12"],["Bike Sprints","6×20s"]],
  "Lower B": [["Leg Press","3×10"],["Hip Thrust","3×10"],["Reverse Lunge","3×10/leg"],["Back Extension","3×12"],["Incline Walk","15 min"]],
  "Full Body": [["DB Goblet Squat","3×10"],["DB RDL","3×10"],["DB Bench Press","3×10"],["Lat Pulldown","3×12"],["Rower Intervals","5×1 min"]],
  "Home – Bodyweight A": [["DB Goblet Squat","3×15 (backpack or no weight)"],["Push-Up","3×AMRAP"],["Glute Bridge","3×15"],["Dead Bug","3×10"]],
  "Home – Bodyweight B": [["Reverse Lunge","3×12/leg"],["Pike Push-Up","3×8"],["Back Extension","3×15 (floor)"],["Plank","3×45s"]],
  "Home – Bodyweight C": [["Walking Lunge","3×20 steps"],["Push-Up","3×AMRAP"],["Glute Bridge","3×20"],["Incline Walk","20 min outdoors"]],
  "Hotel – Dumbbell": [["DB Goblet Squat","4×12 · 3s lowering"],["1-Arm DB Row","4×12/arm"],["DB Bench Press","3×12"],["DB RDL","3×12"],["Plank","3×45s"]],
};

// Weekly pattern per member: weekday -> workout. 0=Sun.
function mkProgram(pattern, start = "2026-11-30", weeks = 4) {
  const out = []; const d0 = new Date(start + "T12:00:00");
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(d0); d.setDate(d0.getDate() + i);
    const w = pattern[d.getDay()];
    if (w) out.push({ id: "w" + i, date: d.toISOString().slice(0,10), name: w, exercises: TEMPLATES[w].map(([n, rx]) => ({ name: n, rx })) });
  }
  return out;
}

a reply from you that says what happens next.</li>\n</ul>\n</section>\n\n<section id=\"pb-route\"><h3>Handle it, check first, or hand off</h3>\n<table class=\"pb-table\"><thead><tr><th>Handle it yourself</th><th>Check the plan first, then handle it</th><th>Hand to the coach (Note for coach)</th></tr></thead>\n<tbody><tr>\n<td><ul><li>Rescheduling, booking, cancelling</li><li>Moving or missed workouts</li><li>Exercise swaps for equipment or preference</li><li>Travel and holiday workouts</li><li>Pausing <i>workouts</i> for a trip, camp or illness</li><li>App and wearable problems</li><li>Simple nutrition questions (snacks, swaps, \"does this count\")</li></ul></td>\n<td><ul><li>Which weight to use: check the member's logged lifts</li><li>Protein and calorie questions: check the Nutrition targets</li><li>Small program tweaks: check the notes first</li></ul></td>\n<td><ul><li>Pain or injury that is sharp, keeps coming back, or lasts into the next day</li><li>Dizziness, chest symptoms or anything medical (mark <b>Urgent</b>)</li><li>Medication, GLP-1s, lab results</li><li>Scan results and what they mean</li><li>Form-check videos</li><li>Changes to program direction, phase or days per week</li><li>Personal and life events</li></ul></td>\n</tr></tbody></table>\n<p>When you hand off, still reply to the member that day. Say their coach will follow up and when, and give them anything safe to do in the meantime. For pain, take the exercise out or swap it to a pain-free option until the coach reviews. Never diagnose.</p>\n</section>\n\n<section id=\"pb-gm\"><h3>When to escalate to a GM</h3>\n<ul>\n<li>Requests to cancel, freeze or pause the <b>membership or billing</b>.</li>\n<li>Any refund that isn't a clear duplicate charge.</li>\n<li>Complaints and upset members.</li>\n<li>Send it to the GM for the member's office: <b>Erin Walsh</b> for SF and Walnut Creek, <b>Marcus Bell</b> for Palo Alto and San Jose.</li>\n<li>Tell the member the GM will reach out within 1 business day. Don't promise a refund or an outcome.</li>\n</ul>\n<p>A short break from <i>workouts</i> with a reason and an end date (a trip, a camp, being sick) is a program change. It is not a membership pause. Handle it yourself with <b>Pause workouts</b> in the Program tab.</p>\n</section>\n\n<section id=\"pb-sched\"><h3>Scheduling rules</h3>\n<ul>\n<li>Offer <b>two specific times</b>, not \"when works for you?\". If the member has already asked for a time and it's free, book it and confirm the date, time and office in one message.</li>\n<li>Book at the member's own office unless they ask for another one. Each member's office is in their Overview.</li>\n<li><b>Progress scans</b> are 5 weeks apart. Anywhere from 4 to 6 weeks after the last scan is fine.</li>\n<li><b>Reschedules are always free.</b></li>\n<li><b>Cancellations less than 24 hours ahead</b> carry a $50 late fee. Waive it for illness or an emergency by ticking \"Waive late fee\" when you cancel.</li>\n<li><b>Running late:</b> the session still ends at its booked time. Reply right away and message the front desk from the appointment in Calendar.</li>\n<li>Coach check-in calls happen on the coach's call calendar. A coach on PTO has no open call slots until they're back.</li>\n</ul>\n</section>\n\n<section id=\"pb-billing\"><h3>Billing</h3>\n<ul>\n<li>You may refund a <b>clear duplicate charge</b> yourself in Billing: the same item, the same amount, the same day. Refund only the extra one.</li>\n<li>Every other refund request goes to the GM.</li>\n<li>Refunds take 5\u201310 business days to show up.</li>\n<li>Receipts (FSA/HSA, expenses) are sent from Billing. Pick the charge the member asked about.</li>\n</ul>\n</section>\n\n<section id=\"pb-offices\"><h3>Offices</h3>\n<table class=\"pb-table\"><thead><tr><th>Office</th><th>Hours</th><th>Parking</th></tr></thead><tbody>\n<tr><td>San Francisco</td><td>Mon\u2013Fri 7 AM\u20137 PM, Sat 7 AM\u20132 PM, closed Sun</td><td>Validated parking in the Harbor Lane garage across the street, level 2. Bring the ticket to the front desk.</td></tr>\n<tr><td>Palo Alto</td><td>Tue\u2013Sun 7 AM\u20136 PM, closed Mon</td><td>Free lot behind the building; any spot marked Kalos.</td></tr>\n<tr><td>San Jose</td><td>Mon\u2013Fri 7 AM\u20137 PM, Sat 7 AM\u201312 PM, closed Sun</td><td>Street parking on Alder St (2-hour limit).</td></tr>\n<tr><td>Walnut Creek</td><td>Tue\u2013Sat 7 AM\u20135 PM, closed Sun\u2013Mon</td><td>Free parking in the Oak Plaza lot.</td></tr>\n</tbody></table>\n</section>\n\n<section id=\"pb-prices\"><h3>Prices and first-scan prep</h3>\n<table class=\"pb-table\"><tbody>\n<tr><td>First DEXA scan</td><td>$150</td></tr><tr><td>Extra progress scan</td><td>$95</td></tr><tr><td>4-week program</td><td>$499</td></tr><tr><td>12-week package</td><td>$1,788</td></tr><tr><td>Monthly membership</td><td>$399 / month</td></tr><tr><td>Nutrition coaching add-on</td><td>$49 / month</td></tr>\n</tbody></table>\n<p><b>Before a DEXA scan:</b></p>\n<ul>\n<li>Wear workout clothes with no metal (zips, underwire, buttons).</li>\n<li>Skip calcium supplements that morning.</li>\n<li>Avoid a hard workout or a big meal in the 2 hours before.</li>\n<li>The scan takes about 10 minutes, and the visit about 45.</li>\n</ul>\n</section>\n\n<section id=\"pb-program\"><h3>Programming basics</h3>\n<ul>\n<li><b>Missed a workout?</b> Do the next workout in order and shift the rest. Don't skip it. Move the days in the Program tab.</li>\n<li><b>Swaps</b> keep the same movement pattern and muscles. For example, one single-leg exercise for another, one vertical pull for another. Apply a swap to the workouts it's meant for: only the trip days for travel, every upcoming workout for a preference.</li>\n<li><b>Travel and holidays:</b> use the \"Hotel \u2013 Dumbbell\" or \"Home \u2013 Bodyweight A/B/C\" workouts on the right dates. Light dumbbells can still be hard work with slower lowering and more reps.</li>\n<li><b>Which weight:</b> go by their heaviest recent weight in Logged lifts. RPE 8 means they could do about 2 more reps.</li>\n<li><b>Logged weights are the total weight.</b> For dumbbells that means both added together: \"DB Bench Press 40 lb\" is a 20 lb dumbbell in each hand.</li>\n<li><b>Protein:</b> use the target already on the member's Nutrition tab. Don't use a rule of thumb that contradicts it.</li>\n</ul>\n</section>\n\n<section id=\"pb-style\"><h3>How we write to members</h3>\n<ul>\n<li>Short, warm and specific, like a real person texting. No scripts or marketing language.</li>\n<li>Use their name. Ask at most one question.</li>\n<li>Always give a next step: what you did, what happens next, and when.</li>\n<li>Confirm dates as day + date + time + office, for example \"Tue Dec 8, 9:00 AM, Palo Alto\".</li>\n<li>Never promise what isn't yours to give (refunds, coach decisions).</li>\n</ul>\n</section>\n";

/* ---------- timers ---------- */
let lastTick = Date.now(), hiddenAt = null;
setInterval(() => {
  const now = Date.now(), dt = Math.min(5000, now - lastTick); lastTick = now;
  const visible = !document.hidden && document.hasFocus();
  if (S.phase === "playbook" && visible) S.pbMs += dt;
  if (S.phase === "test") {
    if (visible) { S.focusMs += dt; const cur = UI.open || ((UI.view === "calendar" || UI.view === "billing") ? UI.lastTodo : null); if (cur) tdState(cur).activeMs += dt; if (!UI.open) S.viewMs = Object.assign(S.viewMs || {}, { [UI.view]: ((S.viewMs || {})[UI.view] || 0) + dt }); }
    if (UI.view === "playbook" && visible) S.pbInTestMs = (S.pbInTestMs || 0) + dt;
    if (tNow() >= TEST_MS) finish("time");
    const el = $("#timer"); if (el) { const left = TEST_MS - tNow(); el.textContent = clock(left); el.classList.toggle("warn", left < 10 * 60000); }
  }
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (S.phase !== "test" && S.phase !== "playbook") return;
  if (document.hidden) { hiddenAt = Date.now(); log("tab_hidden"); flushEvents(); save(true); if (WEB && S.phase === "test" && Date.now() - webLastSend > 20000) webSend("hidden"); }
  else if (hiddenAt) { const d = Date.now() - hiddenAt; S.awayMs += d; log("tab_visible", { awayMs: d }); hiddenAt = null; save(); }
});
window.addEventListener("blur", () => { if (S.phase === "test") log("window_blur"); });
window.addEventListener("focus", () => { if (S.phase === "test") log("window_focus"); });

/* copy/paste tracking */
let internalCopies = [];
document.addEventListener("copy", () => { const s = String(window.getSelection() || ""); if (s) { internalCopies.push(s.trim()); internalCopies = internalCopies.slice(-30); } });
document.addEventListener("paste", e => {
  if (S.phase !== "test") return;
  const txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
  const internal = internalCopies.some(c => c && (txt.trim() === c || c.includes(txt.trim()) || txt.includes(c)));
  const id = UI.open; if (id) { const s = tdState(id); s.pastes++; if (!internal) s.extPastes++; }
  log("paste", { len: txt.length, internal, sample: txt.slice(0, 300) });
  save();
});

/* ---------- render root ---------- */
function render() {
  const app = $("#app"), keep = captureInputs(app);
  if (UI.ownerResults) app.innerHTML = shellView();
  else if (UI.review) app.innerHTML = reviewView();
  else if (S.phase === "welcome") app.innerHTML = welcomeView();
  else if (S.phase === "playbook") app.innerHTML = playbookIntroView();
  else if (S.phase === "done") app.innerHTML = doneView();
  else app.innerHTML = shellView();
  restoreInputs(app, keep);
  renderLayer();
}
function renderLayer() {
  const L = $("#layer"); let h = "";
  if (S.phase === "test") {
    if (UI.open) h += convoView(UI.open);
    if (UI.side) h += sideView();
  }
  if (UI.confirm) h += confirmView();
  if (UI.toast) h += `<div class="toast" role="status">${esc(UI.toast)}</div>`;
  const keep = captureInputs(L);
  L.innerHTML = h;
  restoreInputs(L, keep);
  const th = $(".dlg .thread", L); if (th && UI.scrollThread) { th.scrollTop = th.scrollHeight; UI.scrollThread = false; }
}
// keep typed text across re-renders of the overlay
function captureInputs(root) { const m = {}; root.querySelectorAll("[id]").forEach(el => { if ("value" in el && el.type !== "checkbox" && el.type !== "radio") m[el.id] = [el.value, el === document.activeElement, el.selectionStart]; else if (el.type === "checkbox" || el.type === "radio") m[el.id] = [el.checked, false, null, true]; }); return m; }
function restoreInputs(root, m) { for (const [id, [v, foc, sel, chk]] of Object.entries(m)) { const el = root.querySelector("#" + CSS.escape(id)); if (!el || el.dataset.reset) continue; if (chk) el.checked = v; else { el.value = v; if (foc) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (_) { } } } } }
let toastT; function toast(msg) { UI.toast = msg; renderLayer(); clearTimeout(toastT); toastT = setTimeout(() => { UI.toast = null; renderLayer(); }, 2200); }
